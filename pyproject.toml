[project]
name = "langgraph-brief"
version = "0.1.0"
description = "LangGraph 单框架实测：联网检索 → 事实交叉核验 → 500字技术简报（含 MCP 接入）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.16",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "requests>=2.34.2",
    "lxml>=6.1.3",
    "deepagents>=0.7.32",
    "langchain-core>=1.7.0",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
]

[tool.uv]
# 受限环境将缓存/索引放在项目内，避免写入用户全局缓存被拒
cache-dir = ".uv-cache"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
]
