[project]
name = "langgraph-brief"
version = "0.1.0"
description = "LangGraph 通用 agent 内核 + 技术简报实测案例（MCP / Skills 可注入）"
requires-python = ">=3.11"
dependencies = [
    # —— 内核依赖：只要 agent 循环本身 ——
    "langgraph>=1.2.16",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langchain-core>=1.7.0",
    "deepagents>=0.7.32",
    # —— 示例（example/）依赖：MCP 检索、抓取、可视化 ——
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "requests>=2.34.2",
    "lxml>=6.1.3",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "streamlit>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 内核是唯一的发行包；example/ 只是本仓库里的测试案例，不参与安装
packages = ["src/langgraph_agent"]

[tool.uv]
# 受限环境将缓存/索引放在项目内，避免写入用户全局缓存被拒
cache-dir = ".uv-cache"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
]
